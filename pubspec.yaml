name: shahin_app
description: "Shahin - وسيط النقل الذكي في السودان"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  share_plus: ^10.1.4

  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  # التعامل مع البيانات والقاعدة
  supabase_flutter: ^2.8.3
  shared_preferences: ^2.3.3
  
  
  # الرسوم المتحركة
  lottie: ^3.1.2       

  # الخرائط والموقع
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^2.1.1
  location: ^5.0.0
  
  # إدارة الحالة والأدوات
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  intl: any # يتوافق مع flutter_localizations
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
 
  assets:
    - assets/lottie/
    - assets/images/